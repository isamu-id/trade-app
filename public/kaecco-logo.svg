<svg width="320" height="100" viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg">
  <!-- わらしべを3本のラインで表現 -->
  <g transform="translate(18, 52)">
    <!-- 左のわら -->
    <line x1="10" y1="30" x2="28" y2="-30" stroke="#b8860b" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <!-- 中央のわら（メイン） -->
    <line x1="20" y1="30" x2="20" y2="-34" stroke="#b8860b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 右のわら -->
    <line x1="30" y1="30" x2="12" y2="-30" stroke="#b8860b" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <!-- 結び目 -->
    <circle cx="20" cy="-2" r="4" fill="none" stroke="#b8860b" stroke-width="1.5"/>
    <!-- 先端の輝き（中央） -->
    <circle cx="20" cy="-36" r="2.5" fill="#f0c040"/>
    <!-- 先端の輝き（左右） -->
    <circle cx="28" cy="-32" r="1.5" fill="#f0c040" opacity="0.6"/>
    <circle cx="12" cy="-32" r="1.5" fill="#f0c040" opacity="0.6"/>
  </g>

  <!-- メインテキスト -->
  <text x="68" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="400" letter-spacing="1.5" fill="#1a1a1a">kaecco</text>

  <!-- サブテキスト「かえっこ」 -->
  <text x="68" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="10" letter-spacing="5" fill="#b8860b">かえっこ</text>
</svg>
